<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Sistem ID Delima - SK Taman Palma</title>
  <style>
    /* ============================================================
       DARK CYBER THEME 
    ============================================================ */
    :root {
      --bg-utama: #0a0e17;
      --bg-kad: rgba(10, 14, 23, 0.85);
      --bg-input: #111927;
      --border-input: #1a2a3a;
      --teks-utama: #c8d6e5;
      --teks-label: #8899aa;
      
      --biru-neon: #00d4ff;
      --biru-gelap: #0a1628;
      --oren: #ff6b35;
      --oren-gelap: #cc4400;
      --hijau-matrix: #00ff41;
      --merah-cyber: #ff0055;
      
      --glow-biru: 0 0 20px rgba(0, 212, 255, 0.3);
      --glow-oren: 0 0 25px rgba(255, 107, 53, 0.3);
      --glow-hijau: 0 0 15px rgba(0, 255, 65, 0.2);
      
      --bg-wave: rgba(10, 14, 23, 0.95);
      --bg-kotak-dalam: #0d1a2b;
      --bg-ralat-dalam: #1a0d10;
      --teks-ralat: #ff6b6b;
      --teks-hasil: #c8d6e5;
      --teks-hasil-label: #00d4ff;
      --teks-nota: #445566;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', 'Courier New', monospace;
      background: var(--bg-utama);
      background-image:
        radial-gradient(ellipse at 10% 20%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 50%),
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    /* Matrix rain effect pada background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 255, 65, 0.01) 2px,
          rgba(0, 255, 65, 0.01) 4px);
      pointer-events: none;
      z-index: 0;
    }

    .kad {
      width: 100%;
      max-width: clamp(420px, 42vw, 600px);
      background: var(--bg-kad);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid rgba(0, 212, 255, 0.15);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), var(--glow-biru);
      position: relative;
      z-index: 1;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    /* Scanning line effect */
    .kad::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--biru-neon), transparent);
      animation: scanLine 3s ease-in-out infinite;
      opacity: 0.5;
      z-index: 10;
    }

    @keyframes scanLine {
      0% {
        top: 0;
        opacity: 0;
      }
      10% {
        opacity: 0.5;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        top: 100%;
        opacity: 0;
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .kad:hover {
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.9), var(--glow-biru);
        transform: translateY(-4px) scale(1.01);
      }
    }

    /* ============================================================
       HEADER 
    ============================================================ */
    .header {
      background: linear-gradient(135deg, #0a1628, #0d1f3c 50%, #1a0a10);
      padding: clamp(32px, 4vw, 44px) clamp(24px, 3vw, 34px) clamp(34px, 4vw, 46px);
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(0, 212, 255, 0.1);
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(0, 212, 255, 0.05) 0%, transparent 60%);
      animation: glowPulse 6s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    .wave-divider {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 24px;
      display: block;
      filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.1));
    }

    .lencana-bulat {
      width: clamp(84px, 8vw, 108px);
      height: clamp(84px, 8vw, 108px);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #0d1f3c, #0a0e17);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.2), inset 0 0 30px rgba(0, 212, 255, 0.05);
      overflow: hidden;
      padding: 4px;
      border: 2px solid rgba(0, 212, 255, 0.2);
      position: relative;
      z-index: 1;
    }

    .lencana-bulat svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .header h1 {
      color: #fff;
      font-size: clamp(15px, 1.6vw, 21px);
      font-weight: 700;
      margin: 0;
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
      position: relative;
      z-index: 1;
      font-family: 'Courier New', monospace;
    }

    .header h1 span {
      color: var(--biru-neon);
    }

    .header p {
      color: rgba(0, 212, 255, 0.7);
      font-size: clamp(12.5px, 1.1vw, 14.5px);
      margin: 5px 0 0;
      font-weight: 500;
      position: relative;
      z-index: 1;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    /* ============================================================
       ISI KAD
    ============================================================ */
    .isi {
      padding: clamp(26px, 3vw, 36px) clamp(24px, 3vw, 34px) clamp(24px, 3vw, 32px);
      background: var(--bg-wave);
      backdrop-filter: blur(10px);
    }

    label {
      font-size: clamp(13px, 1vw, 14.5px);
      color: var(--teks-label);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .ikon-label {
      width: clamp(15px, 1.1vw, 17px);
      height: clamp(15px, 1.1vw, 17px);
      color: var(--biru-neon);
      flex-shrink: 0;
      filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.3));
    }

    .medan {
      position: relative;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      height: clamp(46px, 3.6vw, 52px);
      padding: 0 14px;
      border: 1.5px solid var(--border-input);
      border-radius: 10px;
      font-size: clamp(16px, 1.1vw, 17px);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.3s;
      background: var(--bg-input);
      color: var(--teks-utama);
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      font-weight: 600;
    }

    input:focus {
      border-color: var(--biru-neon);
      box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.1), 0 0 30px rgba(0, 212, 255, 0.15);
      background: #0d1a2b;
    }

    input::placeholder {
      color: #334455;
      letter-spacing: 1px;
      font-weight: 400;
    }

    input[inputmode="numeric"] {
      letter-spacing: 4px;
      font-weight: 700;
    }

    /* ============================================================
       STEP SAHKAN - Cyber Style
    ============================================================ */
    #stepSahkan {
      display: none;
      margin-top: 12px;
      padding: 14px 16px;
      background: rgba(0, 212, 255, 0.05);
      border-radius: 12px;
      border-left: 3px solid var(--biru-neon);
      border: 1px solid rgba(0, 212, 255, 0.1);
      box-shadow: inset 0 0 30px rgba(0, 212, 255, 0.03);
    }

    #stepSahkan.tunjuk {
      display: block;
      animation: fadeSlide 0.3s ease;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #stepSahkan p {
      margin: 0 0 10px 0;
      font-weight: 600;
      color: var(--biru-neon);
      font-size: 14px;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    #stepSahkan .nama-dijumpai {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin: 6px 0 12px 0;
      padding: 8px 12px;
      background: rgba(0, 212, 255, 0.05);
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(0, 212, 255, 0.1);
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-group button {
      flex: 1;
      height: clamp(42px, 3.2vw, 48px);
      border: none;
      border-radius: 10px;
      font-size: clamp(14px, 0.9vw, 15px);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .btn-group button:active {
      transform: scale(0.97);
    }

    .btn-sah {
      background: linear-gradient(135deg, #00d4ff, #0066cc);
      color: #fff;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
    }

    .btn-sah:hover {
      box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
    }

    .btn-batal {
      background: rgba(255, 0, 85, 0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255, 0, 85, 0.2);
    }

    .btn-batal:hover {
      background: rgba(255, 0, 85, 0.2);
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.1);
    }

    /* ============================================================
       BUTTON UTAMA - Cyber Style
    ============================================================ */
    button {
      width: 100%;
      height: clamp(48px, 3.8vw, 54px);
      background: linear-gradient(135deg, #ff6b35, #cc4400);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: clamp(15px, 1.1vw, 16.5px);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 0 30px rgba(255, 107, 53, 0.2);
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
    }

    button::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #ff6b35, #00d4ff, #ff6b35);
      background-size: 400% 400%;
      border-radius: 12px;
      z-index: -1;
      animation: borderGlow 4s ease-in-out infinite;
      opacity: 0.3;
    }

    @keyframes borderGlow {
      0%,
      100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .riak {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transform: scale(0);
      animation: riakBesar 0.55s ease-out;
      pointer-events: none;
    }

    @keyframes riakBesar {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }

    button:hover {
      box-shadow: 0 0 50px rgba(255, 107, 53, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ============================================================
       KOTAK HASIL - Cyber Style
    ============================================================ */
    .kotak {
      margin-top: 18px;
      border-radius: 14px;
      padding: 4px;
      display: none;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(255, 107, 53, 0.2));
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      box-shadow: var(--glow-biru);
    }

    .kotak.tunjuk {
      opacity: 1;
      transform: translateY(0);
    }

    .kotak.gegar {
      animation: goncang 0.45s ease;
    }

    @keyframes goncang {
      0%,
      100% {
        transform: translateY(0) translateX(0);
      }
      20% {
        transform: translateY(0) translateX(-7px);
      }
      40% {
        transform: translateY(0) translateX(6px);
      }
      60% {
        transform: translateY(0) translateX(-4px);
      }
      80% {
        transform: translateY(0) translateX(2px);
      }
    }

    .kotak-dalam {
      background: var(--bg-kotak-dalam);
      border-radius: 11px;
      padding: 16px 18px;
      border: 1px solid rgba(0, 212, 255, 0.05);
    }

    .kotak.ralat {
      background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(200, 0, 50, 0.2));
    }

    .baris-hasil {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
    }

    .baris-hasil+.baris-hasil {
      border-top: 1px dashed rgba(0, 212, 255, 0.05);
    }

    .baris-hasil .kiri {
      min-width: 0;
    }

    .baris-hasil p.label {
      font-size: clamp(11px, 0.85vw, 12.5px);
      color: var(--teks-hasil-label);
      margin: 0 0 3px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
    }

    .baris-hasil p.nilai {
      font-size: clamp(14.5px, 1.1vw, 16.5px);
      font-weight: 700;
      color: var(--teks-hasil);
      margin: 0;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
    }

    .btn-salin {
      flex-shrink: 0;
      width: auto;
      height: 34px;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 212, 255, 0.05);
      color: var(--biru-neon);
      box-shadow: none;
      border: 1px solid rgba(0, 212, 255, 0.1);
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-salin::before {
      display: none;
    }

    .btn-salin:hover {
      background: rgba(0, 212, 255, 0.1);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
    }

    /* ============================================================
       RALAT
    ============================================================ */
    .kotak-dalam.ralat-dalam {
      background: rgba(255, 0, 85, 0.05);
      border: 1px solid rgba(255, 0, 85, 0.1);
    }

    .kotak.ralat .kotak-dalam {
      background: rgba(255, 0, 85, 0.05);
    }

    .kotak.ralat p.mesej-ralat {
      font-size: 13.5px;
      color: var(--teks-ralat);
      margin: 0;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
    }

    /* ============================================================
       SKELETON
    ============================================================ */
    .skeleton {
      display: none;
      margin-top: 18px;
      border-radius: 14px;
      padding: 4px;
    }

    .skeleton-dalam {
      background: var(--bg-kotak-dalam);
      border-radius: 11px;
      padding: 16px 18px;
      border: 1px solid rgba(0, 212, 255, 0.05);
    }

    .baris-skel {
      padding: 8px 0;
    }

    .baris-skel+.baris-skel {
      border-top: 1px dashed rgba(0, 212, 255, 0.05);
    }

    .bar-skel {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, #0d1f3c 25%, #1a2a4a 50%, #0d1f3c 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s ease-in-out infinite;
    }

    .bar-skel.label-skel {
      width: 40%;
      margin-bottom: 8px;
    }
    .bar-skel.nilai-skel {
      width: 75%;
      height: 14px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* ============================================================
       SPINNER
    ============================================================ */
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: putar 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: -3px;
    }

    @keyframes putar {
      to {
        transform: rotate(360deg);
      }
    }

    /* ============================================================
       NOTA & MOTTO
    ============================================================ */
    .nota {
      font-size: 11px;
      color: var(--teks-nota);
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .motto {
      font-size: 9.5px;
      color: rgba(255, 107, 53, 0.3);
      text-align: center;
      margin: 6px 0 0;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    /* ============================================================
       TOAST
    ============================================================ */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: #0d1a2b;
      color: var(--biru-neon);
      padding: 11px 20px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), var(--glow-biru);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 999;
      white-space: nowrap;
      border: 1px solid rgba(0, 212, 255, 0.1);
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .toast.tunjuk {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast svg {
      width: 15px;
      height: 15px;
      color: var(--hijau-matrix);
      flex-shrink: 0;
    }

    /* ============================================================
       SCROLLBAR CYBER
    ============================================================ */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--biru-neon), var(--oren));
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #00aaff, #ff5500);
      background-clip: padding-box;
    }
    html {
      scrollbar-width: thin;
      scrollbar-color: var(--biru-neon) rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 380px) {
      .isi {
        padding: 22px 18px 20px;
      }
      .header {
        padding: 26px 18px 30px;
      }
    }
  </style>
</head>
<body>

  <div class="kad">
    <div class="header">
      <div class="lencana-bulat">
        <!-- LOGO SK TAMAN PALMA - Cyber Version -->
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <rect width="200" height="200" rx="100" fill="#0a0e17"/>
          <rect x="20" y="30" width="160" height="140" rx="10" fill="#0d1f3c" stroke="#00d4ff" stroke-width="1"/>
          <!-- Buku terbuka -->
          <path d="M100 60 L70 80 L70 120 L100 100 L130 120 L130 80 L100 60Z" fill="#00d4ff" opacity="0.8"/>
          <path d="M100 60 L100 100" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
          <path d="M70 80 L70 120 L100 100" fill="#00aaff" opacity="0.6"/>
          <path d="M130 80 L130 120 L100 100" fill="#00aaff" opacity="0.6"/>
          <!-- Bintang -->
          <circle cx="100" cy="145" r="8" fill="#ff6b35" opacity="0.8"/>
          <!-- API -->
          <path d="M95 55 Q100 40 105 55 Q100 48 95 55Z" fill="#ff0055"/>
          <path d="M92 50 Q100 30 108 50 Q100 42 92 50Z" fill="#ff6b35"/>
          <!-- Teks -->
          <text x="100" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#00d4ff" font-family="'Courier New',monospace">SK TAMAN PALMA</text>
        </svg>
      </div>
      <h1>SK Taman <span>Palma</span></h1>
      <p>✦ Sistem ID Delima ✦</p>
      <svg class="wave-divider" viewBox="0 0 500 32" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,32 L0,14 Q125,0 250,14 T500,14 L500,32 Z" fill="var(--bg-wave)"></path>
      </svg>
    </div>

    <div class="isi">
      <form id="borang" onsubmit="return false;">
        <div class="medan">
          <label for="ic">
            <svg class="ikon-label" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="6" y1="15" x2="10" y2="15"></line>
              <circle cx="7" cy="10" r="1.5"></circle>
              <line x1="12" y1="10" x2="18" y2="10"></line>
              <line x1="12" y1="13" x2="16" y2="13"></line>
            </svg>
            [ NOMBOR IC ]
          </label>
          <input id="ic" type="text" inputmode="numeric" maxlength="12" placeholder="010101010101" autocomplete="off">
        </div>

        <button id="btnSemak" type="button">
          <span class="spinner" id="spinner"></span>
          <span id="btnTeks">▶ Cari ID Delima</span>
        </button>
      </form>

      <!-- STEP SAHKAN NAMA -->
      <div id="stepSahkan">
        <p>⏺ SAHKAN IDENTITI</p>
        <div class="nama-dijumpai" id="namaDijumpai">-</div>
        <div class="btn-group">
          <button class="btn-sah" id="btnSah">✔ SAH</button>
          <button class="btn-batal" id="btnBatal">✘ BATAL</button>
        </div>
      </div>

      <!-- SKELETON LOADING -->
      <div class="skeleton" id="skeletonHasil">
        <div class="skeleton-dalam">
          <div class="baris-skel">
            <div class="bar-skel label-skel"></div>
            <div class="bar-skel nilai-skel"></div>
          </div>
          <div class="baris-skel">
            <div class="bar-skel label-skel"></div>
            <div class="bar-skel nilai-skel"></div>
          </div>
        </div>
      </div>

      <!-- KOTAK HASIL -->
      <div class="kotak" id="kotakHasil">
        <div class="kotak-dalam">
          <div class="baris-hasil">
            <div class="kiri">
              <p class="label">► ID DELIMA</p>
              <p class="nilai" id="outEmail"></p>
            </div>
            <button type="button" class="btn-salin" data-target="outEmail">SALIN</button>
          </div>
          <div class="baris-hasil">
            <div class="kiri">
              <p class="label">► KATA LALUAN</p>
              <p class="nilai" id="outPass"></p>
            </div>
            <button type="button" class="btn-salin" data-target="outPass">SALIN</button>
          </div>
        </div>
      </div>

      <!-- KOTAK RALAT -->
      <div class="kotak ralat" id="kotakRalat">
        <div class="kotak-dalam ralat-dalam">
          <p class="mesej-ralat" id="mesejRalat"></p>
        </div>
      </div>

      <p class="nota">[ SK TAMAN PALMA - SISTEM DELIMA ]</p>
      <p class="motto">✦ KECEMERLANGAN ✦ PENDIDIKAN ✦ DIUTAMAKAN ✦</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ================================================================
    // 📌 LETAK LINK WEB APP APPS SCRIPT HANG DI SINI
    // ================================================================
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwNMybAPRMZxHduT4rr_rU3fHaC0xQ0TBDP9pg5VJn1p1L3sOZgIHYCqRF1Lfz-AKDeSQ/exec:"

    // ================================================================
    // VARIABEL
    // ================================================================
    const icInput = document.getElementById('ic');
    const btnSemak = document.getElementById('btnSemak');
    const spinner = document.getElementById('spinner');
    const btnTeks = document.getElementById('btnTeks');
    const kotakHasil = document.getElementById('kotakHasil');
    const kotakRalat = document.getElementById('kotakRalat');
    const skeletonHasil = document.getElementById('skeletonHasil');
    const stepSahkan = document.getElementById('stepSahkan');
    const namaDijumpai = document.getElementById('namaDijumpai');
    const btnSah = document.getElementById('btnSah');
    const btnBatal = document.getElementById('btnBatal');

    let dataRekod = null;

    // ================================================================
    // IC FIELD - Hanya angka, max 12 digit
    // ================================================================
    icInput.addEventListener('input', function(e) {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 12);
    });

    // ================================================================
    // RIPPLE EFFECT
    // ================================================================
    document.querySelectorAll('button').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        const rect = btn.getBoundingClientRect();
        const saiz = Math.max(rect.width, rect.height);
        const riak = document.createElement('span');
        riak.className = 'riak';
        riak.style.width = riak.style.height = saiz + 'px';
        riak.style.left = (e.clientX - rect.left - saiz / 2) + 'px';
        riak.style.top = (e.clientY - rect.top - saiz / 2) + 'px';
        btn.appendChild(riak);
        setTimeout(function() {
          riak.remove();
        }, 550);
      });
    });

    // ================================================================
    // FUNGSI UTAMA - CARI IC
    // ================================================================
    function jalankanSemakan() {
      const ic = icInput.value.trim();

      // Sembunyi semua
      kotakHasil.style.display = 'none';
      kotakHasil.classList.remove('tunjuk');
      kotakRalat.style.display = 'none';
      kotakRalat.classList.remove('tunjuk', 'gegar');
      skeletonHasil.style.display = 'none';
      stepSahkan.classList.remove('tunjuk');
      stepSahkan.style.display = 'none';
      dataRekod = null;

      // Validation
      if (!ic) {
        tunjukRalat('Sila isi nombor IC.');
        return;
      }
      if (ic.length < 6) {
        tunjukRalat('Nombor IC tidak sah (minimum 6 digit).');
        return;
      }

      if (!WEBAPP_URL || WEBAPP_URL === '') {
        tunjukRalat('🔴 WEBAPP_URL belum disetkan.');
        return;
      }

      tunjukLoading(true);
      skeletonHasil.style.display = 'block';

      const url = WEBAPP_URL + '?ic=' + encodeURIComponent(ic);

      fetch(url)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(hasil) {
          tunjukLoading(false);
          skeletonHasil.style.display = 'none';

          if (hasil.status === 'jumpa') {
            dataRekod = {
              nama: hasil.nama || 'Nama tidak dijumpai',
              idDelima: hasil.idDelima || '-',
              kataLaluan: hasil.kataLaluan || '-'
            };

            namaDijumpai.textContent = dataRekod.nama;
            stepSahkan.style.display = 'block';
            void stepSahkan.offsetWidth;
            stepSahkan.classList.add('tunjuk');

          } else {
            tunjukRalat(hasil.mesej || 'Rekod tidak dijumpai.');
          }
        })
        .catch(function(err) {
          tunjukLoading(false);
          skeletonHasil.style.display = 'none';
          tunjukRalat('Ralat sambungan: ' + err.message);
          console.error('Fetch error:', err);
        });
    }

    // ================================================================
    // SAHKAN NAMA
    // ================================================================
    function sahkanDanKeluar() {
      if (!dataRekod) return;

      stepSahkan.classList.remove('tunjuk');
      stepSahkan.style.display = 'none';

      document.getElementById('outEmail').textContent = dataRekod.idDelima;
      document.getElementById('outPass').textContent = dataRekod.kataLaluan;

      kotakHasil.style.display = 'block';
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          kotakHasil.classList.add('tunjuk');
        });
      });

      dataRekod = null;
    }

    // ================================================================
    // BATAL
    // ================================================================
    function batalDanUlang() {
      stepSahkan.classList.remove('tunjuk');
      stepSahkan.style.display = 'none';
      dataRekod = null;
      icInput.focus();
      icInput.select();
    }

    // ================================================================
    // EVENT LISTENERS
    // ================================================================
    btnSemak.addEventListener('click', function(e) {
      e.preventDefault();
      jalankanSemakan();
    });

    icInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        jalankanSemakan();
      }
    });

    btnSah.addEventListener('click', function(e) {
      e.preventDefault();
      sahkanDanKeluar();
    });

    btnBatal.addEventListener('click', function(e) {
      e.preventDefault();
      batalDanUlang();
    });

    // ================================================================
    // TOAST
    // ================================================================
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function tunjukToast(mesej) {
      toastEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' + mesej;
      toastEl.classList.add('tunjuk');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toastEl.classList.remove('tunjuk');
      }, 1800);
    }

    document.querySelectorAll('.btn-salin').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const teks = document.getElementById(btn.dataset.target).textContent;
        if (!teks || teks === '-') {
          tunjukToast('Tiada data');
          return;
        }
        navigator.clipboard.writeText(teks).then(function() {
          tunjukToast('Disalin!');
        }).catch(function() {
          const area = document.createElement('textarea');
          area.value = teks;
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
          tunjukToast('Disalin!');
        });
      });
    });

    // ================================================================
    // FUNGSI UTILITI
    // ================================================================
    function tunjukLoading(loading) {
      btnSemak.disabled = loading;
      spinner.style.display = loading ? 'inline-block' : 'none';
      btnTeks.textContent = loading ? '⏳ Menyemak...' : '▶ Cari ID Delima';
    }

    function tunjukRalat(mesej) {
      document.getElementById('mesejRalat').textContent = mesej;
      kotakRalat.style.display = 'block';

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          kotakRalat.classList.add('tunjuk');
        });
      });

      kotakRalat.classList.remove('gegar');
      void kotakRalat.offsetWidth;
      kotakRalat.classList.add('gegar');
    }
  </script>

</body>
</html>
