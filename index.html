RRRRYAoooosAUUUUWAKKKKLAFFFFFgCiiinYD//Z">
  <style>
    :root {
      --biru: #2BA6DE;
      --biru-gelap: #0e5f8e;
      --oren: #F0812A;
      --oren-gelap: #b85d18;
      --teks-hasil: #06304d;
      --teks-hasil-label: #1a7abf;
      --teks-ralat: #7a2a10;

      --bg-kad: rgba(255,255,255,0.85);
      --bg-input: #f8f9fb;
      --border-input: #e0e4ea;
      --teks-label: #556;
      --bg-kotak-dalam: #fff;
      --bg-ralat-dalam: #fff5f0;
      --teks-nota: #99a1ac;
      --bg-wave: rgba(255,255,255,0.92);
    }

    body { transition: background 0.3s; }
    .kad, input, .kotak-dalam { transition: background 0.3s, border-color 0.3s, color 0.3s; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, .btn-salin {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #1c8fce 0%, #2BA6DE 30%, #F0812A 100%);
      background-size: 250% 250%;
      animation: alunGradient 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    @keyframes alunGradient {
      0% { background-position: 0% 30%; }
      50% { background-position: 100% 70%; }
      100% { background-position: 0% 30%; }
    }

    .kad {
      width: 100%;
      max-width: 420px;
      background: var(--bg-kad);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.5);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      position: relative;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .kad:hover {
        box-shadow: 0 28px 64px rgba(0,0,0,0.32);
        transform: translateY(-4px);
      }
    }

    .header {
      background: linear-gradient(135deg, var(--biru-gelap), var(--biru) 55%, var(--oren) 130%);
      padding: 32px 24px 34px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .wave-divider {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 24px;
      display: block;
    }

    .lencana-bulat {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #fff;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      overflow: hidden;
      padding: 4px;
    }

    .lencana-bulat img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .header h1 {
      color: #fff;
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.15);
    }

    .header p {
      color: rgba(255,255,255,0.92);
      font-size: 12.5px;
      margin: 5px 0 0;
      font-weight: 500;
    }

    .isi {
      padding: 26px 24px 24px;
      background: var(--bg-wave);
    }

    label {
      font-size: 13px;
      color: var(--teks-label);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .ikon-label {
      width: 15px;
      height: 15px;
      color: var(--biru);
      flex-shrink: 0;
    }

    .medan {
      position: relative;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1.5px solid var(--border-input);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.3s;
      background: var(--bg-input);
      color: var(--teks-hasil);
    }

    input:focus {
      border-color: var(--biru);
      box-shadow: 0 0 0 4px rgba(43,166,222,0.18), 0 0 14px rgba(43,166,222,0.35);
      background: #fff;
    }

    input[inputmode="numeric"] {
      letter-spacing: 3px;
      font-weight: 600;
    }

    button {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--oren), var(--oren-gelap));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 6px 16px rgba(240,129,42,0.35);
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    .riak {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      transform: scale(0);
      animation: riakBesar 0.55s ease-out;
      pointer-events: none;
    }

    @keyframes riakBesar {
      to { transform: scale(3); opacity: 0; }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.15);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--biru), var(--oren));
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--biru-gelap), var(--oren-gelap));
      background-clip: padding-box;
    }
    html {
      scrollbar-width: thin;
      scrollbar-color: var(--biru) rgba(255,255,255,0.15);
    }

    button:hover { box-shadow: 0 8px 20px rgba(240,129,42,0.45); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .kotak {
      margin-top: 18px;
      border-radius: 14px;
      padding: 4px;
      display: none;
      background: linear-gradient(135deg, var(--biru), var(--oren));
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .kotak.tunjuk {
      opacity: 1;
      transform: translateY(0);
    }

    .kotak.gegar {
      animation: goncang 0.45s ease;
    }

    @keyframes goncang {
      0%, 100% { transform: translateY(0) translateX(0); }
      20% { transform: translateY(0) translateX(-7px); }
      40% { transform: translateY(0) translateX(6px); }
      60% { transform: translateY(0) translateX(-4px); }
      80% { transform: translateY(0) translateX(2px); }
    }

    .kotak-dalam {
      background: var(--bg-kotak-dalam);
      border-radius: 11px;
      padding: 16px 18px;
    }

    .kotak.ralat {
      background: linear-gradient(135deg, #e8734f, #c94a2b);
    }

    .baris-hasil {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
    }

    .baris-hasil + .baris-hasil {
      border-top: 1px dashed #e5e8ee;
    }

    .baris-hasil .kiri { min-width: 0; }

    .baris-hasil p.label {
      font-size: 11px;
      color: var(--teks-hasil-label);
      margin: 0 0 3px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .baris-hasil p.nilai {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--teks-hasil);
      margin: 0;
      word-break: break-all;
    }

    .btn-salin {
      flex-shrink: 0;
      width: auto;
      height: 34px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
      background: #eef6fb;
      color: var(--biru-gelap);
      box-shadow: none;
      border: 1px solid #cfe6f4;
    }

    .btn-salin:hover { background: #dcedf7; box-shadow: none; }
    .btn-salin.disalin { background: #e2f3e6; color: #1e7a37; border-color: #bfe6c8; }

    .kotak-dalam.ralat-dalam {
      background: var(--bg-ralat-dalam);
    }

    .kotak.ralat .kotak-dalam {
      background: var(--bg-ralat-dalam);
    }

    .kotak.ralat p.mesej-ralat {
      font-size: 13.5px;
      color: var(--teks-ralat);
      margin: 0;
      font-weight: 600;
    }

    .nota {
      font-size: 11px;
      color: var(--teks-nota);
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
    }

    .motto {
      font-size: 9.5px;
      color: var(--oren-gelap);
      text-align: center;
      margin: 6px 0 0;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: putar 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: -3px;
    }

    @keyframes putar { to { transform: rotate(360deg); } }

    .skeleton {
      display: none;
      margin-top: 18px;
      border-radius: 14px;
      padding: 4px;
    }

    .skeleton-dalam {
      background: var(--bg-kotak-dalam);
      border-radius: 11px;
      padding: 16px 18px;
    }

    .baris-skel {
      padding: 8px 0;
    }

    .baris-skel + .baris-skel {
      border-top: 1px dashed #e5e8ee;
    }

    .bar-skel {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, #e8ebf0 25%, #f4f6f9 50%, #e8ebf0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s ease-in-out infinite;
    }

    .bar-skel.label-skel { width: 40%; margin-bottom: 8px; }
    .bar-skel.nilai-skel { width: 75%; height: 14px; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 380px) {
      .isi { padding: 22px 18px 20px; }
      .header { padding: 26px 18px 30px; }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: #1f2733;
      color: #fff;
      padding: 11px 20px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.tunjuk {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast svg { width: 15px; height: 15px; color: #4ADE80; flex-shrink: 0; }
  </style>

            <button type="button" class="btn-salin" data-target="outEmail">Salin</button>
          </div>
          <div class="baris-hasil">
            <div class="kiri">
              <p class="label">Kata laluan</p>
              <p class="nilai" id="outPass"></p>
            </div>
            <button type="button" class="btn-salin" data-target="outPass">Salin</button>
          </div>
        </div>
      </div>

      <div class="kotak ralat" id="kotakRalat">
        <div class="kotak-dalam ralat-dalam">
          <p class="mesej-ralat" id="mesejRalat"></p>
        </div>
      </div>

      <p class="nota">Untuk kegunaan ibubapa/murid SK Taman Palma sahaja</p>
      <p class="motto">KECEMERLANGAN &bull; PENDIDIKAN &bull; DIUTAMAKAN</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ====================================================================
    // LETAK LINK WEB APP APPS SCRIPT HANG KAT SINI (dalam tanda petik "")
    // Contoh: https://script.google.com/macros/s/AKfycbXXXXXXXXXXXXX/exec
    // Ambik link ni lepas hang buat Deploy > New deployment > Web app
    // ====================================================================
    const WEBAPP_URL = "https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbwNMybAPRMZxHduT4rr_rU3fHaC0xQ0TBDP9pg5VJn1p1L3sOZgIHYCqRF1Lfz-AKDeSQ/exec";

    // ---- Ripple effect pada semua butang ----
    document.querySelectorAll('button').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        const rect = btn.getBoundingClientRect();
        const saiz = Math.max(rect.width, rect.height);
        const riak = document.createElement('span');
        riak.className = 'riak';
        riak.style.width = riak.style.height = saiz + 'px';
        riak.style.left = (e.clientX - rect.left - saiz / 2) + 'px';
        riak.style.top = (e.clientY - rect.top - saiz / 2) + 'px';
        btn.appendChild(riak);
        setTimeout(function() { riak.remove(); }, 550);
      });
    });

    const borang = document.getElementById('borang');
    const btnSemak = document.getElementById('btnSemak');
    const spinner = document.getElementById('spinner');
    const btnTeks = document.getElementById('btnTeks');
    const kotakHasil = document.getElementById('kotakHasil');
    const kotakRalat = document.getElementById('kotakRalat');
    const skeletonHasil = document.getElementById('skeletonHasil');

    document.getElementById('nama').addEventListener('input', function(e) {
      const posisi = e.target.selectionStart;
      e.target.value = e.target.value.toUpperCase();
      e.target.setSelectionRange(posisi, posisi);
    });

    function jalankanSemakan() {
      const nama = document.getElementById('nama').value.trim();

      kotakHasil.style.display = 'none';
      kotakHasil.classList.remove('tunjuk');
      kotakRalat.style.display = 'none';
      kotakRalat.classList.remove('tunjuk', 'gegar');
      skeletonHasil.style.display = 'none';

      if (!nama) {
        tunjukRalat('Sila isi nama murid.');
        return;
      }

      if (!WEBAPP_URL || WEBAPP_URL.indexOf('PASTE_LINK') !== -1) {
        tunjukRalat('Link Web App belum diletakkan dalam kod (WEBAPP_URL).');
        return;
      }

      tunjukLoading(true);
      skeletonHasil.style.display = 'block';

      const url = WEBAPP_URL + '?nama=' + encodeURIComponent(nama);

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(hasil) {
          tunjukLoading(false);
          skeletonHasil.style.display = 'none';
          if (hasil.status === 'jumpa') {
            document.getElementById('outEmail').textContent = hasil.idDelima;
            document.getElementById('outPass').textContent = hasil.kataLaluan;
            kotakHasil.style.display = 'block';
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                kotakHasil.classList.add('tunjuk');
              });
            });
          } else {
            tunjukRalat(hasil.mesej || 'Rekod tidak dijumpai.');
          }
        })
        .catch(function(err) {
          tunjukLoading(false);
          skeletonHasil.style.display = 'none';
          tunjukRalat('Ralat sambungan: ' + err.message);
        });
    }

    btnSemak.addEventListener('click', function(e) {
      e.preventDefault();
      jalankanSemakan();
    });

    document.getElementById('nama').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        jalankanSemakan();
      }
    });

    // ---- Toast notification ----
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function tunjukToast(mesej) {
      toastEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' + mesej;
      toastEl.classList.add('tunjuk');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toastEl.classList.remove('tunjuk');
      }, 1800);
    }

    document.querySelectorAll('.btn-salin').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const teks = document.getElementById(btn.dataset.target).textContent;
        navigator.clipboard.writeText(teks).then(function() {
          tunjukToast('Disalin!');
        });
      });
    });

    function tunjukLoading(loading) {
      btnSemak.disabled = loading;
      spinner.style.display = loading ? 'inline-block' : 'none';
      btnTeks.textContent = loading ? 'Menyemak...' : 'Semak ID Delima';
    }

    function tunjukRalat(mesej) {
      document.getElementById('mesejRalat').textContent = mesej;
      kotakRalat.style.display = 'block';

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          kotakRalat.classList.add('tunjuk');
        });
      });

      kotakRalat.classList.remove('gegar');
      void kotakRalat.offsetWidth;
      kotakRalat.classList.add('gegar');
    }
  </script>

</body>
</html>
